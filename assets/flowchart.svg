<rect width="1600" height="900" rx="28" fill="#0e1726"/>
<text x="80" y="80" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#f2f5fb">Program flow</text><rect x="80" y="150" width="240" height="80" rx="40" fill="#16233d" stroke="#35e0b5" stroke-width="3"/><text x="200.0" y="198.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f2f5fb">Start</text><path d="M320 190H400" fill="none" stroke="#8b7cff" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></path><rect x="400" y="150" width="300" height="80" rx="14" fill="#16233d" stroke="#35e0b5" stroke-width="3"/><text x="550.0" y="186.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f2f5fb">Enter bill</text><text x="550.0" y="212.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#9fb0d6">float(input())</text><path d="M700 190H790" fill="none" stroke="#8b7cff" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></path><polygon points="900,125.0 1010.0,190 900,255.0 790.0,190" fill="#16233d" stroke="#ffc857" stroke-width="3"/><text x="900" y="197" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#f2f5fb">bill &gt; 0 ?</text><path d="M900 255V320" fill="none" stroke="#8b7cff" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></path><text x="915" y="295" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffc857">yes</text><path d="M1010 190H1100" fill="none" stroke="#8b7cff" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></path><text x="1040" y="175" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffc857">no</text><rect x="1100" y="150" width="400" height="80" rx="14" fill="#16233d" stroke="#ff6b6b" stroke-width="3"/><text x="1300.0" y="186.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f2f5fb">Error message</text><text x="1300.0" y="212.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#9fb0d6">program stops</text><rect x="750" y="320" width="300" height="110" rx="14" fill="#16233d" stroke="#35e0b5" stroke-width="3"/><text x="900.0" y="371.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f2f5fb">Standard tier</text><text x="900.0" y="397.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#9fb0d6">if / elif / elif / else</text><path d="M900 430V490" fill="none" stroke="#8b7cff" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></path><rect x="750" y="490" width="300" height="90" rx="14" fill="#16233d" stroke="#35e0b5" stroke-width="3"/><text x="900.0" y="531.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f2f5fb">Membership?</text><text x="900.0" y="557.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#9fb0d6">strip().lower() == 'yes'</text><path d="M900 580V640" fill="none" stroke="#8b7cff" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/></path><polygon points="900,640.0 1020.0,700 900,760.0 780.0,700" fill="#16233d" stro