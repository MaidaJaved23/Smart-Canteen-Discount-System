<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" role="img" aria-label="Smart Canteen Discount System header">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1726"/><stop offset="1" stop-color="#1c2a4a"/></linearGradient>
<linearGradient id="tt" x1="0" x2="1"><stop offset="0" stop-color="#35e0b5"/><stop offset="1" stop-color="#ffc857"/></linearGradient>
<filter id="gl"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="c"><rect width="1600" height="420" rx="28"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="1600" height="420" fill="url(#bg)"/>
<g opacity=".18" stroke="#8b7cff" stroke-width="1"><path d="M0 70H1600M0 140H1600M0 210H1600M0 280H1600M0 350H1600"/></g>
<g fill="#ffc857" filter="url(#gl)">
<circle cx="180" cy="340" r="26"><animate attributeName="cy" values="340;120;340" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;.2;.9" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="1420" cy="300" r="20" fill="#35e0b5"><animate attributeName="cy" values="300;90;300" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="1300" cy="360" r="14" fill="#8b7cff"><animate attributeName="cy" values="360;140;360" dur="8s" repeatCount="indefinite"/></circle>
<circle cx="300" cy="100" r="12" fill="#35e0b5"><animate attributeName="cy" values="100;330;100" dur="9s" repeatCount="indefinite"/></circle>
</g>
<g transform="translate(1180 70)"><rect width="260" height="280" rx="18" fill="#f2f5fb" opacity=".95"/>
<g font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#0e1726"><text x="24" y="46" font-weight="700">CANTEEN BILL</text><text x="24" y="92">Total  Rs. 3000</text><text x="24" y="128">Tier   20%</text><text x="24" y="164">Card   +5%</text></g>
<rect x="24" y="186" width="212" height="3" fill="#0e1726" opacity=".3"/>
<text x="24" y="232" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#12a37f">Pay Rs. 2250<animate attributeName="opacity" values="1;.4;1" dur="2.4s" repeatCount="indefinite"/></text>
<animateTransform attributeName="transform" type="translate" values="1180 70;1180 55;1180 70" dur="4s" repeatCount="indefinite"/></g>
<text x="90" y="170" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#35e0b5">Python Conditional Statements</text>
<text x="90" y="250" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="76" font-weight="800" fill="url(#tt)">Smart Canteen</text>
<text x="90" y="320" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="76" font-weight="800" fill="url(#tt)">Discount System</text>
<text x="90" y="372" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#c9d3ea">if  ·  elif  ·  else  —  decisions your program can explain</text>
<rect x="90" y="388" width="0" height="5" rx="2.5" fill="#ffc857"><animate attributeName="width" values="0;640;0" dur="5s" repeatCount="indefinite"/></rect>
</g></svg>
